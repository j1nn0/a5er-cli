name: Release

# Trusted-publishing workflow. This filename is registered as the npm
# Trusted Publisher workflow value, so do not rename this file.
# Triggers only on stable version tags; pull requests and branch pushes
# never publish.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# One release flow per tag. Re-runs queue instead of racing; a re-run
# stops at the already-published check below rather than republishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: verify, publish and confirm
    runs-on: ubuntu-latest
    # Environment npm-release carries NO required reviewers and no manual
    # approval gate, by explicit policy: releases run fully automatically
    # once an agent pushes a version tag. Compensating automated gates are
    # the tag trigger, version match, main ancestry, already-published
    # refusal and tarball integrity match below. Complementary admin-side
    # restrictions (environment deployment branches/tags limited to release
    # tags, tag ruleset, main protection) remain manual setup and are
    # reported as pending, not implemented here.
    environment:
      name: npm-release
    permissions:
      contents: read
      id-token: write
    # 15 minutes of confirmation budget, plus install, build, typecheck, lint,
    # format, test, tarball inspection and the publish itself. Pre-publish work
    # must never shrink the confirmation budget: a job killed by its own timeout
    # would skip the GitHub Release exactly like the v0.1.1 failure did.
    timeout-minutes: 45
    steps:
      - name: Checkout the tag with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Check npm CLI supports OIDC publishing
        shell: bash
        run: |
          NPM_BIN="$(command -v npm)"
          echo "npm: $NPM_BIN $(npm --version)"
          NPM_VER="$(npm --version)"
          if ! [[ "$NPM_VER" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "refusing non-stable npm version: $NPM_VER"
            exit 1
          fi
          test "$(printf '%s\n%s' "11.5.1" "$NPM_VER" | sort -V | head -n 1)" = "11.5.1"

      - name: Refuse non-stable tag names
        shell: bash
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a stable version tag: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Match tag version with package.json
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(node -p "require('./package.json').version")"
          test "$TAG_VER" = "$PKG_VER"

      - name: Require the tag commit on main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # A re-run after a successful publish stops here instead of
      # republishing. Creating the GitHub Release for that case needs
      # manual integrity review, so the workflow never proceeds
      # automatically when the version already exists.
      - name: Refuse an already-published version
        shell: bash
        run: |
          PKG_VER="$(node -p "require('./package.json').version")"
          if npm view "@j1nn0/a5er-cli@${PKG_VER}" version --registry=https://registry.npmjs.org/ --@j1nn0:registry=https://registry.npmjs.org/ 2>npm-err.txt; then
            echo "version ${PKG_VER} is already published; refusing to republish"
            exit 1
          fi
          if grep -q "^npm error code E404$" npm-err.txt; then
            echo "version ${PKG_VER} is not published; proceeding"
          else
            cat npm-err.txt
            echo "registry check failed for a reason other than absence; stopping"
            exit 1
          fi

      - name: Inspect the publish candidate tarball
        shell: bash
        run: |
          CAND="$RUNNER_TEMP/publish-candidate"
          rm -rf "$CAND"
          mkdir -p "$CAND"
          pnpm pack --pack-destination "$CAND"
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VER="$(node -p "require('./package.json').version")"
          test "$PKG_NAME" = "@j1nn0/a5er-cli"
          test "$PKG_VER" = "${GITHUB_REF_NAME#v}"
          TARBALL="$CAND/j1nn0-a5er-cli-$PKG_VER.tgz"
          test -f "$TARBALL"
          if ! tar -tzf "$TARBALL" > "$CAND/contents.txt"; then
            echo "cannot list publish candidate contents"
            exit 1
          fi
          for f in package/dist/cli.js package/dist/index.js package/dist/index.d.ts package/README.md package/LICENSE package/package.json; do
            if ! grep -qxF "$f" "$CAND/contents.txt"; then
              echo "missing required file: $f"
              exit 1
            fi
          done
          FORBID_RC=0
          grep -qiE '\.a5er$|\.npmrc$|\.env$|/(tests?|skills?|fixtures?)/|credentials?|secret' "$CAND/contents.txt" || FORBID_RC=$?
          if [ "$FORBID_RC" -eq 0 ]; then
            echo "forbidden content in publish candidate"
            exit 1
          elif [ "$FORBID_RC" -eq 1 ]; then
            echo "no forbidden content"
          else
            echo "forbidden-content scan failed with exit $FORBID_RC"
            exit 1
          fi
          CLI_TMP="$CAND/cli-head.js"
          if ! tar -xzOf "$TARBALL" package/dist/cli.js > "$CLI_TMP"; then
            echo "cannot extract package/dist/cli.js"
            exit 1
          fi
          test "$(head -n 1 "$CLI_TMP")" = "#!/usr/bin/env node"
          tar -xzOf "$TARBALL" package/package.json > "$CAND/manifest.json"
          MANIFEST_PATH="$CAND/manifest.json" EXPECTED_VER="$PKG_VER" EXPECTED_TAG="${GITHUB_REF_NAME#v}" node -e '
          const fs = require("fs");
          const fail = (msg) => { console.error("manifest check failed: " + msg); process.exit(1); };
          let m;
          try {
            m = JSON.parse(fs.readFileSync(process.env.MANIFEST_PATH, "utf8"));
          } catch (e) {
            fail("manifest is not valid JSON");
          }
          const s = (v, what) => { if (typeof v !== "string" || v.length === 0) fail(what + " is not a non-empty string"); };
          if (typeof m !== "object" || m === null || Array.isArray(m)) fail("top level is not an object");
          s(m.name, "name");
          if (m.name !== "@j1nn0/a5er-cli") fail("name mismatch");
          s(m.version, "version");
          if (m.version !== process.env.EXPECTED_VER) fail("version mismatch with source manifest");
          if (m.version !== process.env.EXPECTED_TAG) fail("version mismatch with git tag");
          if (typeof m.bin !== "object" || m.bin === null) fail("bin is not an object");
          s(m.bin.a5er, "bin.a5er");
          if (m.bin.a5er !== "./dist/cli.js") fail("bin.a5er mismatch");
          if (Object.prototype.hasOwnProperty.call(m, "private")) fail("private must be absent");
          s(m.main, "main");
          if (m.main !== "./dist/index.js") fail("main mismatch");
          s(m.types, "types");
          if (m.types !== "./dist/index.d.ts") fail("types mismatch");
          if (typeof m.exports !== "object" || m.exports === null) fail("exports is not an object");
          const sub = m.exports["."];
          if (typeof sub !== "object" || sub === null) fail("exports dot entry is not an object");
          s(sub.types, "exports dot types");
          if (sub.types !== "./dist/index.d.ts") fail("exports dot types mismatch");
          s(sub.default, "exports dot default");
          if (sub.default !== "./dist/index.js") fail("exports dot default mismatch");
          '
          SRI="$(node -p "require('crypto').createHash('sha512').update(require('fs').readFileSync('$TARBALL')).digest('base64')")"
          echo "TARBALL_PATH=$TARBALL" >> "$GITHUB_ENV"
          echo "TARBALL_SRI=sha512-$SRI" >> "$GITHUB_ENV"

      # OIDC authentication comes from id-token: write. No NODE_AUTH_TOKEN,
      # no caches and no long-lived credentials are used here. The default
      # dist-tag (latest) applies; do not pass --tag.
      # The tarball path form keeps OIDC authentication and automatic
      # provenance: npm exchanges the OIDC token for the session before
      # uploading, independent of the payload form. Verified locally only
      # to dry-run; an actual OIDC publish needs the npm trusted publisher.
      - name: Publish the inspected tarball to npm with OIDC
        shell: bash
        run: |
          test -f "$TARBALL_PATH"
          ACTUAL_SRI="sha512-$(node -p "require('crypto').createHash('sha512').update(require('fs').readFileSync(process.env.TARBALL_PATH)).digest('base64')")"
          test "$ACTUAL_SRI" = "$TARBALL_SRI"
          npm publish "$TARBALL_PATH" --access public --registry=https://registry.npmjs.org/ --@j1nn0:registry=https://registry.npmjs.org/

      # The npm CLI reports success before the package document is readable from
      # the registry ("Your package is being processed and may take a few minutes
      # to become available"). The v0.1.1 release failed here: six 20s attempts
      # were all E404, the step exited 1 and the GitHub Release job was skipped
      # although the publish had succeeded. Pure absence is therefore retried for
      # up to 15 minutes of wall clock and ends as a warning, while every answer
      # that is not provably one matching integrity value, and every error other
      # than a pure E404, stops the job immediately.
      - name: Confirm the published package
        shell: bash
        run: |
          PKG_VER="${GITHUB_REF#refs/tags/v}"
          PKG="@j1nn0/a5er-cli@${PKG_VER}"
          REGISTRY="https://registry.npmjs.org/"
          SCOPE_REGISTRY="--@j1nn0:registry=https://registry.npmjs.org/"
          WAIT_BUDGET_SECONDS=900
          RETRY_INTERVAL_SECONDS=20
          QUERY_LIMIT_SECONDS=60
          FETCH_TIMEOUT_MS=60000
          VIEW_OUT="$RUNNER_TEMP/registry-view.out"
          VIEW_ERR="$RUNNER_TEMP/registry-view.err"
          VERDICT_OUT="$RUNNER_TEMP/registry-verdict.txt"
          CLASSIFIER_ERR="$RUNNER_TEMP/registry-classifier.err"
          CLASSIFIER="$RUNNER_TEMP/classify-registry-answer.cjs"
          SUMMARY_FILE="${GITHUB_STEP_SUMMARY:-/dev/null}"

          # Classifies one npm view result from its exact bytes. Only a single
          # sha512 value with at most one trailing newline counts as an answer,
          # so a second line, an embedded CR or any other extra data can never
          # be read as a match. Exit code, stdout and stderr must agree.
          cat > "$CLASSIFIER" <<'NODE'
          const fs = require('node:fs');
          const [rcArg, outPath, errPath, expected] = process.argv.slice(2);
          const rc = Number(rcArg);
          const out = fs.readFileSync(outPath);
          const err = fs.readFileSync(errPath, 'latin1');
          const emit = (verdict, detail) => {
            process.stdout.write(`VERDICT=${verdict}\n`);
            if (detail) process.stdout.write(`DETAIL=${detail.replace(/\s+/g, ' ').trim()}\n`);
            process.exit(0);
          };
          const codes = [
            ...new Set(
              err
                .split('\n')
                .map((line) => line.match(/^npm error code (\S+)$/))
                .filter(Boolean)
                .map((m) => m[1]),
            ),
          ];
          // A time limit, a signal or an unexpected exit code is never absence.
          if (rc === 124) emit('FAIL', 'the registry query was stopped by its time limit');
          if (rc === 125 || rc === 126 || rc === 127) emit('FAIL', `the registry query could not be executed (exit ${rc})`);
          if (rc >= 128) emit('FAIL', `the registry query was terminated by signal ${rc - 128}`);
          if (rc !== 0 && rc !== 1) emit('FAIL', `unexpected npm exit code ${rc}`);
          if (codes.length > 1) emit('FAIL', `npm reported several error codes: ${codes.join(', ')}`);
          if (rc === 1 && codes.length === 0) emit('FAIL', 'npm failed without reporting an error code');
          if (rc === 0 && codes.length > 0) emit('FAIL', `npm exited 0 but reported ${codes[0]}`);
          if (rc === 0 && /^npm error /m.test(err)) emit('FAIL', 'npm exited 0 but wrote error output');
          if (rc === 1) {
            if (codes[0] !== 'E404') emit('FAIL', `npm error code ${codes[0]} is not absence`);
            const mixedCodes = [...new Set(err.match(/\bE\d{3}\b/g) ?? [])].filter((c) => c !== 'E404');
            if (mixedCodes.length > 0) emit('FAIL', `mixed error codes in the registry answer: ${mixedCodes.join(', ')}`);
            const statuses = [...new Set([...err.matchAll(/^npm error ([1-5]\d\d) /gm)].map((m) => m[1]))];
            const mixedStatus = statuses.filter((s) => s !== '404');
            if (mixedStatus.length > 0) emit('FAIL', `mixed HTTP statuses in the registry answer: ${mixedStatus.join(', ')}`);
            if (!/^npm error 404 (Not Found - GET|No match found for version) /m.test(err)) emit('FAIL', 'E404 without a 404 registry response');
            if (out.length > 0) emit('FAIL', 'npm reported absence but also wrote to stdout');
            emit('ABSENT', 'the version is not readable from the registry yet');
          }
          // rc 0: the answer must be exactly one sha512 integrity value.
          if (out.includes(0)) emit('FAIL', 'the registry answer contains a NUL byte');
          let body = out;
          if (body.length > 0 && body[body.length - 1] === 0x0a) body = body.subarray(0, body.length - 1);
          const text = body.toString('latin1');
          if (text.length === 0) emit('FAIL', 'the registry answer is empty');
          if (/[\x00-\x1f\x7f]/.test(text)) emit('FAIL', 'the registry answer spans several lines or contains control characters');
          if (!/^sha512-[A-Za-z0-9+/]+={0,2}$/.test(text)) emit('FAIL', `the registry answer is not one sha512 integrity value: ${JSON.stringify(text.slice(0, 160))}`);
          if (text !== expected) emit('MISMATCH', text);
          emit('MATCH', text);
          NODE

          if [ -z "${TARBALL_SRI:-}" ]; then
            echo "::error title=Missing expected integrity::TARBALL_SRI is unset; the published tarball cannot be verified"
            exit 1
          fi

          fail() {
            echo "::error title=Registry confirmation failed::$1"
            exit 1
          }

          START_EPOCH="$(date +%s)"
          DEADLINE_EPOCH=$((START_EPOCH + WAIT_BUDGET_SECONDS))
          ATTEMPTS=0

          while :; do
            # No query starts at or after the deadline, and the remaining budget
            # bounds the whole npm process, not only its own fetch timeout.
            REMAINING=$((DEADLINE_EPOCH - $(date +%s)))
            if [ "$REMAINING" -le 0 ]; then
              break
            fi
            QUERY_TIMEOUT_SECONDS="$QUERY_LIMIT_SECONDS"
            if [ "$QUERY_TIMEOUT_SECONDS" -gt "$REMAINING" ]; then
              QUERY_TIMEOUT_SECONDS="$REMAINING"
            fi
            ATTEMPTS=$((ATTEMPTS + 1))

            # --prefer-online asks the registry rather than a cached document;
            # --fetch-retries=0 keeps npm from hiding a 5xx behind a later 404.
            VIEW_RC=0
            timeout --signal=TERM --kill-after=5s "${QUERY_TIMEOUT_SECONDS}s" \
              npm view "$PKG" dist.integrity \
                --registry="$REGISTRY" "$SCOPE_REGISTRY" \
                --prefer-online --fetch-retries=0 --fetch-timeout="$FETCH_TIMEOUT_MS" \
                >"$VIEW_OUT" 2>"$VIEW_ERR" || VIEW_RC=$?

            CLASSIFY_RC=0
            node "$CLASSIFIER" "$VIEW_RC" "$VIEW_OUT" "$VIEW_ERR" "$TARBALL_SRI" >"$VERDICT_OUT" 2>"$CLASSIFIER_ERR" || CLASSIFY_RC=$?
            VERDICT="$(sed -n 's/^VERDICT=//p' "$VERDICT_OUT")"
            DETAIL="$(sed -n 's/^DETAIL=//p' "$VERDICT_OUT")"
            if [ "$CLASSIFY_RC" -ne 0 ] || [ -z "$VERDICT" ]; then
              cat "$CLASSIFIER_ERR" "$VIEW_ERR"
              fail "the registry answer could not be classified (classifier exit ${CLASSIFY_RC})"
            fi

            case "$VERDICT" in
              MATCH)
                if [ "$(date +%s)" -gt "$DEADLINE_EPOCH" ]; then
                  cat "$VIEW_OUT"
                  fail "the registry answered after the ${WAIT_BUDGET_SECONDS}s deadline; a late answer is not a confirmation"
                fi
                echo "confirmed $PKG after ${ATTEMPTS} attempt(s): registry integrity matches the inspected tarball"
                echo "expected dist.integrity: $TARBALL_SRI"
                echo "observed dist.integrity: $DETAIL"
                rm -rf "$RUNNER_TEMP/publish-candidate"
                exit 0
                ;;
              MISMATCH)
                echo "expected dist.integrity: $TARBALL_SRI"
                echo "observed dist.integrity: $DETAIL"
                fail "integrity mismatch for $PKG; the registry copy is not the inspected tarball"
                ;;
              FAIL)
                cat "$VIEW_ERR"
                fail "$DETAIL (npm exit ${VIEW_RC})"
                ;;
              ABSENT)
                REMAINING=$((DEADLINE_EPOCH - $(date +%s)))
                if [ "$REMAINING" -le 0 ]; then
                  break
                fi
                SLEEP_SECONDS="$RETRY_INTERVAL_SECONDS"
                if [ "$SLEEP_SECONDS" -gt "$REMAINING" ]; then
                  SLEEP_SECONDS="$REMAINING"
                fi
                echo "attempt ${ATTEMPTS}: ${PKG} not readable yet (E404); waiting ${SLEEP_SECONDS}s, ${REMAINING}s left of ${WAIT_BUDGET_SECONDS}s"
                sleep "$SLEEP_SECONDS"
                ;;
              *)
                fail "unexpected registry verdict: ${VERDICT}"
                ;;
            esac
          done

          # The publish step already succeeded, so absence after the full budget is
          # reported as unverified rather than as a failed release.
          echo "::warning title=Registry verification pending::${PKG} was published successfully, but npm view still returned E404 after ${WAIT_BUDGET_SECONDS}s and ${ATTEMPTS} attempts. dist.integrity is UNCONFIRMED, not verified. The GitHub Release proceeds; re-check the registry integrity by hand."
          {
            echo "## npm publish succeeded, registry verification pending"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| package | \`${PKG}\` |"
            echo "| npm publish step | **succeeded** (OIDC trusted publishing returned success) |"
            echo "| registry integrity check | **UNCONFIRMED** |"
            echo "| expected dist.integrity | \`${TARBALL_SRI}\` |"
            echo "| observed | E404 from ${REGISTRY} on all ${ATTEMPTS} attempts over ${WAIT_BUDGET_SECONDS}s |"
            echo ""
            echo "GitHub Release creation may proceed because npm publish succeeded; registry integrity remains unconfirmed."
            echo ""
            echo "Follow-up: \`npm view ${PKG} dist.integrity\` must return the expected value above."
          } >> "$SUMMARY_FILE"
          exit 0

  # Runs only after the release job fully succeeds. A publish success
  # followed by a failure here stays visible as that exact partial
  # outcome; it is never retried automatically.
  github-release:
    name: create GitHub Release
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes "Release $TAG of @j1nn0/a5er-cli ($VER), published to npm as @j1nn0/a5er-cli@$VER. Install with: npm install -g @j1nn0/a5er-cli@$VER"
