name: CI

on:
  push:
    branches:
      - main
      - 'phase*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 24
          - 26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

  pack-smoke:
    name: pack smoke (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 24
          - 26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack from a clean tree
        shell: bash
        run: |
          rm -rf dist
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          test -f "$RUNNER_TEMP/pack/j1nn0-a5er-cli-0.1.0.tgz"

      - name: Check tarball contents
        shell: bash
        run: |
          tar -tzf "$RUNNER_TEMP/pack/j1nn0-a5er-cli-0.1.0.tgz" | grep -F "package/dist/cli.js"
          tar -tzf "$RUNNER_TEMP/pack/j1nn0-a5er-cli-0.1.0.tgz" | grep -F "package/LICENSE"

      - name: Install tarball and smoke-test the CLI
        shell: bash
        run: |
          REPO="$PWD"
          SMOKE="$RUNNER_TEMP/smoke"
          rm -rf "$SMOKE"
          mkdir -p "$SMOKE"
          cd "$SMOKE"
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund "$RUNNER_TEMP/pack/j1nn0-a5er-cli-0.1.0.tgz"
          node_modules/.bin/a5er --version | grep -F "0.1.0"
          node_modules/.bin/a5er --help >/dev/null
          node_modules/.bin/a5er inspect "$REPO/tests/fixtures/synthetic/fmt-01-baseline.a5er" > out.txt 2> err.txt
          code=$?
          grep -q -F '"status":"ok"' out.txt
          test "$code" = "0"
          node_modules/.bin/a5er validate "$REPO/tests/fixtures/synthetic/sem-08-duplicate-pname.a5er" > out2.txt 2> err2.txt
          code=$?
          test "$code" = "3"
          node_modules/.bin/a5er bogus >/dev/null 2>&1
          test "$?" = "2"
          cd "$REPO"
          rm -rf "$SMOKE" "$RUNNER_TEMP/pack"
